<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bárbaros Painel</title>
<meta name="description" content="Painel do barbeiro da Bárbaros Barbershop.">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="/painel.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/painel-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bárbaros Painel">
<meta property="og:title" content="Bárbaros Painel">
<meta property="og:description" content="Painel do barbeiro da Bárbaros Barbershop.">
<meta property="og:image" content="/icons/icon-512.png">
<style>html,body{margin:0;min-height:100%}img{max-width:100%}[hidden]{display:none!important}body{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app column on a single, deliberate dark "barber's chair" theme: black leather, brushed gold. Bottom tab bar; barber mode swaps the tabs. */
:root{
  --bg:#0A0A0B; --surface:#141517; --surface-2:#1C1D20; --line:#26282B; --line-2:#3F4348;
  --ink:#F1F3F5; --muted:#A6ACB3; --faint:#767D85;
  --gold:#B3B2A9; --gold-2:#F5F4E9; --gold-3:#898576; --gold-ink:#14130E;
  --metal:linear-gradient(105deg,#FCFDF5 0%,#F5F4E9 18%,#898576 21%,#FFFBF2 25%,#E7E5E1 30%,#9B978F 34%,#4D493A 38%,#413627 40%,#9F9F91 45%,#8E8F7F 52%,#72705F 57%,#AAA898 61%,#1B1C13 66%,#777972 70%,#878683 75%,#606271 81%,#A7ABA1 86%,#B3B2A9 100%);
  --chrome-text:linear-gradient(180deg,#FCFDF5 0%,#E7E5E1 30%,#898576 48%,#FFFBF2 58%,#9F9F91 78%,#B3B2A9 100%);
  --ok:#D9DEE3; --ok-bg:#23262A; --warn:#F0B95A; --warn-bg:#2E2412; --bad:#F07067; --bad-bg:#311715; --info:#8CC4F5; --info-bg:#132331;
  --wa:#25D366; --wa-ink:#062611;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:20px;padding-block:20px 8px}
.screen.anim{animation:rise .3s ease}
.local-wrap{padding-top:12px}
.local{overflow:hidden}
.mapa{position:relative;aspect-ratio:16/10;background:#15171a;border-bottom:1px solid var(--line)}
.mapa iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(.15) contrast(1.05)}
.mapa .mload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.local .end{display:flex;gap:10px;align-items:flex-start}
.local .end svg{width:22px;height:22px;flex:none;color:var(--gold-2);margin-top:2px}
.btn-waze{background:#33CCFF;color:#04232e;border:0}
.srch{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;height:44px}
.cl{width:100%;text-align:left}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .it{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.notif{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:.02em;background:var(--chrome-text);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.03em;color:var(--gold-2)}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px;color:var(--muted)} .tiny{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.price{font-weight:800;color:var(--gold-2);white-space:nowrap;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,filter .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn-gold{position:relative;overflow:hidden;background:var(--metal);color:var(--gold-ink);border:1px solid #F7F9FB;box-shadow:0 10px 26px -12px rgba(220,226,232,.7),inset 0 1px 0 #fff,inset 0 -2px 3px rgba(60,66,74,.35);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.btn-gold::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
.btn-gold,.day.sel,.slot.sel,.day.sel small,.day.sel i{text-shadow:0 0 3px #fff,0 0 7px rgba(255,255,255,.95),0 0 12px rgba(255,255,255,.7)!important}

/* interação: letras acesas ao passar o cursor / tocar */
.btn,.tab,.chip,.day,.slot,.svc,.pro,.payopt,.link,.pf,.strip button{transition:color .18s,text-shadow .18s,transform .18s,filter .18s,border-color .18s,box-shadow .18s}
@media (hover:hover){
  .btn:not([disabled]):hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn-gold:not([disabled]):hover,.day.sel:hover,.slot.sel:hover{color:#fff!important;text-shadow:0 0 1px #000,0 0 2px #000,0 0 3px #000,0 0 10px #fff,0 0 18px #fff,0 0 28px rgba(255,255,255,.9)!important}
  .btn-gold:not([disabled]):hover::after{animation-duration:1.1s}
  .btn-line:hover,.btn-ghost:hover,.chip:hover,.tab:hover,.link:hover,.day:not(.sel):not(:disabled):hover,.slot:not(.sel):not(:disabled):hover,.pro:hover,.payopt:hover{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.7),0 0 24px rgba(245,244,233,.5);border-color:var(--gold-2)}
  .tab:hover .ti{color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
  .svc:hover{border-color:var(--gold-2);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 22px -6px rgba(255,255,255,.35)}
  .svc:hover b,.svc:hover .price{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.6)}
  .btn-wa:hover,.btn-ig:hover{text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.85)}
  .pf:hover,.strip button:hover{transform:translateY(-2px);box-shadow:0 0 24px -6px rgba(255,255,255,.4)}
}
.btn:not([disabled]):active,.svc:active,.day:not(:disabled):active,.slot:not(:disabled):active{transform:scale(.98);text-shadow:0 0 8px #fff,0 0 16px rgba(255,255,255,.8)}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
.btn-wa{background:linear-gradient(180deg,#2FE07A,#1EBE5D);color:#fff;border:0;text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 8px 22px -10px #25D366}
.btn-ig{background:linear-gradient(45deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%);color:#fff;border:0;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 8px 22px -10px #D62976}
.btn-line{border:1px solid var(--line-2);background:var(--surface);color:var(--gold-2)}
.btn-ghost{color:var(--muted)}
.btn-danger{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);background:var(--bad-bg)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.w100{width:100%}
.link{color:var(--gold-2);font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}

/* hero */
.hero{position:relative;margin:-20px -16px 0;display:flex;flex-direction:column;padding:0 16px 4px}
.hero-img{position:relative;margin:0 -16px;aspect-ratio:896/1200;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.eye{position:absolute;z-index:2;width:5.2%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.6);border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(circle,#FFE9B8 0%,#FFA62B 20%,rgba(255,96,0,.7) 42%,rgba(230,60,0,.22) 62%,transparent 72%);transition:opacity .35s ease,transform .35s ease}
.eye.bg{width:9%;opacity:0}
.hero-img:hover .eye,.hero-img.acesa .eye{opacity:1;transform:translate(-50%,-50%) scale(1);animation:brasa 1.6s ease-in-out infinite}
.hero-img:hover .eye.bg,.hero-img.acesa .eye.bg{opacity:.85}
.hero-img:hover img,.hero-img.acesa img{filter:brightness(.92) contrast(1.05)}
.hero-img img{transition:filter .4s}
@keyframes brasa{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6) saturate(1.2)}}
.hero-img::after{content:"";position:absolute;inset:auto 0 0 0;height:12%;background:linear-gradient(to bottom,transparent,var(--bg))}
.hero .tag{font-size:14px;color:var(--ink);max-width:34ch}
.hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hero-cta .btn-gold{grid-column:1/-1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fact b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--gold-2)}
.fact span{font-size:11.5px;color:var(--muted)}
.club{position:relative;overflow:hidden;padding:18px;border-radius:18px;border:1px solid var(--line-2);background:
  radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 55%),var(--surface)}
.club .big{font-family:var(--display);font-size:34px;color:var(--gold-2);line-height:1}

.strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:128px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;scroll-snap-align:start}
.strip img{width:100%;height:100%;object-fit:cover;display:block}

/* services */
.svc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,background .15s}
.svc .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.svc .t b{font-weight:700;font-size:15px}
.svc .meta{font-size:12.5px;color:var(--muted)}
.svc .note{font-size:12px;color:var(--faint);line-height:1.4}
.svc .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.svc .from{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.svc.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.tick{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.tick svg{width:14px;height:14px;opacity:0}
.svc.on .tick{background:var(--metal);border-color:var(--gold);color:var(--gold-ink)}
.tick{border-color:var(--gold-3)!important}
.svc.on .tick svg{opacity:1}
.combo{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}

/* booking */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps span{height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--gold)}
.steplbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.steplbl b{color:var(--ink)}
.sum{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface-2) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line-2)}
.sum .l{flex:1;font-size:13px;color:var(--muted);min-width:0}
.nav{display:flex;gap:10px}
.nav .btn-gold,.nav .btn-wa{flex:1}
.lbl{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.lbl svg{width:16px;height:16px;color:var(--gold)}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pro{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.pro b{font-size:14px}.pro span{font-size:12px;color:var(--muted)}
.pro[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font-size:20px;font-variant-numeric:tabular-nums}
.day i{font-style:normal;font-size:10.5px;color:var(--muted)}
.day.sel{background:var(--metal);border-color:transparent;color:var(--gold-ink)}
.day.sel small,.day.sel i{color:var(--gold-ink)}
.day:disabled{opacity:.35;cursor:default}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.slot.sel{background:var(--metal);border-color:transparent;color:var(--gold-ink)}
.slot:disabled{opacity:.28;text-decoration:line-through;cursor:default}
.period{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-top:4px}
.pay{display:grid;gap:10px}
.payopt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.payopt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;margin-top:2px}
.payopt[aria-pressed="true"]{border-color:var(--gold)}
.payopt[aria-pressed="true"] .rd{border:6px solid var(--gold)}
.payopt b{display:block}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);margin-left:6px}
.toggle{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px dashed var(--line-2)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.15s}
.sw[aria-checked="true"]{background:var(--metal)}
.sw[aria-checked="true"]::after{left:21px;background:var(--gold-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;outline:0;width:100%}
.field textarea{padding:12px 14px;min-height:120px;resize:vertical;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.err{color:var(--bad);font-size:12.5px}
.receipt{padding:16px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px}
.receipt dt{color:var(--muted)} .receipt dd{margin:0;text-align:right;font-weight:600}
.receipt hr{border:0;border-top:1px dashed var(--line-2);margin:12px 0}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:22px;color:var(--gold-2);font-variant-numeric:tabular-nums}
.note{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--surface-2);color:var(--muted)}
.okc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 18px}
.okc .ic{width:62px;height:62px;border-radius:50%;background:var(--metal);color:var(--gold-ink);display:grid;place-items:center}
.okc .ic svg{width:30px;height:30px}

/* my bookings */
.bk{padding:14px;display:flex;flex-direction:column;gap:10px}
.bk .when{display:flex;gap:12px;align-items:center}
.datebox{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0;border:1px solid var(--line)}
.datebox b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.datebox{border-color:var(--line-2)!important}
.datebox b{color:var(--gold-2)}
.datebox small{font-size:10.5px;text-transform:uppercase;color:var(--gold);letter-spacing:.08em;font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.03em}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* portfolio */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf{border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column}
.pf img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.pf span{padding:9px 11px 11px;font-size:13px;font-weight:700}
.pf small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:2px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,5,6,.95);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lb-x,.lb-n{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.lb-x svg,.lb-n svg{width:20px;height:20px}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin-block:12px}
.lb-stage img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
.lb-n{position:absolute;top:50%;transform:translateY(-50%)}
.lb-p{left:0}.lb-nx{right:0}

const PUSH_OK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
async function inscreverPush(){

  return (await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)}));
}

/* ======= Pix (BR Code estático, padrão Banco Central) ======= */
function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const emv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
const ascii=(t,n)=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase().slice(0,n);
function pixChave(){return (S.cfg.pixChave||LOJA.pixChave||"").trim()}
function pixPayload(valor,txid){
  const p=emv("00","01")+emv("26",emv("00","br.gov.bcb.pix")+emv("01",pixChave()))+emv("52","0000")+emv("53","986")+(valor>0?emv("54",valor.toFixed(2)):"")+
    emv("58","BR")+emv("59",ascii(LOJA.pixNome,25))+emv("60",ascii(LOJA.pixCidade,15))+emv("62",emv("05",(String(txid||"").replace(/[^A-Za-z0-9]/g,"").slice(0,25))||"***"))+"6304";
  return p+crc16(p);
}
function qrSvg(t){try{if(!window.qrcode)return "";const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ""}}
function valorPix(b){return Math.max(0,Math.round((b.preco-(b.cbUsado||0))*100)/100)}
function PixSheet(b){

    <div class="pixbox">${svg?`<div class="qr">${svg}</div>`:`<p class="small" style="margin:0">Não foi possível desenhar o QR Code aqui. Use o Pix Copia e Cola abaixo.</p>`}
      <div class="pixval"><span class="tiny">Valor</span><b class="num">${brl(v)}</b><span class="tiny">${esc(b.servicos.join(" + "))} · ${br(b.data)} ${b.hora}</span></div></div>

    ${b.aPartir?`<div class="note">Este serviço tem preço "a partir de". Se o valor final for maior, a diferença é paga na barbearia.</div>`:""}
    <a class="btn btn-wa" href="${waTo(LOJA.wa,`*Comprovante Pix — ${LOJA.nome}*\n\n*Código:* ${b.id}\n*Valor:* ${brl(v)}\n*Cliente:* ${b.nome}\n\nSegue o comprovante:`)}" target="_blank" rel="noopener">${ic("wa")} Já paguei: enviar comprovante</a>

function normalize(set){
  const s=new Set(set);
  const has=x=>s.has(x);
  if(has("cb")&&has("sob")){s.delete("cb");s.delete("sob");s.add("cbs")}
  if(has("corte")&&has("barba")){s.delete("corte");s.delete("barba");s.add(has("sob")?"cbs":"cb");if(has("sob"))s.delete("sob")}
  if(has("cbs")){["corte","barba","sob","cb"].forEach(x=>s.delete(x))}
  return s;
}

function cbSaldo(){if(S.cbServer!=null)return S.cbServer;const t=new Date();return S.meus.filter(b=>b.status!=="cancelado"&&b.cbGanho&&!b.cbUsadoEm&&new Date(b.data+"T"+b.hora)<t).reduce((a,b)=>a+b.cbGanho,0)}
function cbPendente(){const t=new Date();return S.meus.filter(b=>b.status!=="cancelado"&&b.cbGanho&&new Date(b.data+"T"+b.hora)>=t).reduce((a,b)=>a+b.cbGanho,0)}

let OCUP={}; // { "2026-10-14": [{i:540,f:580,b:"b1"}] } — publicado pelo barbeiro
function dias(){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let k=0;out.length<LOJA.diasAgenda&&k<60;k++){const x=new Date(d);x.setDate(d.getDate()+k);out.push(x)}return out}
function lojaAberta(d){return LOJA.abre.includes(d.getDay())}
function livre(dateIso,ini,fim,barbId){
  const occ=(OCUP[dateIso]||[]).concat(S.isAdmin?[]:[]);
  const ids=barbId==="qualquer"?barbs().map(b=>b.id):[barbId];
  return ids.find(id=>!occ.some(o=>(o.b===id||!o.b)&&ini<o.f&&fim>o.i))||null;
}
function slotsDo(dateIso,min,barbId){
  const d=fromIso(dateIso);if(!lojaAberta(d))return[];
  const hoje=iso(new Date())===dateIso, lim=nowMin()+LOJA.antecedenciaMin, out=[];
  for(let t=LOJA.inicio;t+Math.max(min,10)<=LOJA.fim;t+=30){
    const f=t+Math.max(min,10);
    let ok=true,why="";
    if(t<LOJA.almoco[1]&&f>LOJA.almoco[0]){ok=false;why="almoço"}
    if(ok&&hoje&&t<lim){ok=false;why="antecedência"}
    if(ok&&!livre(dateIso,t,f,barbId)){ok=false;why="ocupado"}
    out.push({t,ok,why});
  }
  return out;
}
function diaTemVaga(d,min){return slotsDo(iso(d),min,S.barb).some(s=>s.ok)}

  const mx=Math.max(1,...porDia.map(d=>d.q));
  // serviços mais pedidos no período
  const sv={};for(const a of L.filter(a=>a.status!=="cancelado"))for(const nm of a.servicos||[])sv[nm]=(sv[nm]||0)+1;

function parseMsg(t){

  const servTxt=g("Serviço").toLowerCase();
  const s=SERV.slice().sort((a,b)=>b.nome.length-a.nome.length).find(x=>servTxt.includes(x.nome.toLowerCase()))||(servTxt.includes("corte")&&servTxt.includes("barba")&&servTxt.includes("sobr")?svc("cbs"):servTxt.includes("corte")&&servTxt.includes("barba")?svc("cb"):null);
  const dm=g("Data").match(/(\d{2})\/(\d{2})\/(\d{4})/);const hmm=g("Horário").match(/(\d{2}:\d{2})/);
  const val=g("Valor").match(/([\d.,]+)\s*$/);const cb=g("Cashback usado").match(/([\d.,]+)/);
  return {id:g("Código"),nome:g("Cliente"),fone:g("WhatsApp"),svc:s?.id,data:dm?`${dm[3]}-${dm[2]}-${dm[1]}`:"",hora:hmm?hmm[1]:"",pay:/app|pix pelo/i.test(g("Pagamento"))?"app":"loja",
    preco:val?Number(val[1].replace(/\./g,"").replace(",",".")):"",cbUsado:cb?Number(cb[1].replace(",",".")):""};
}

function partes(x){const v=svc(x);return v.combo||[v.id]}
function tog(id){
  const s=svc(id);
  if(S.sel.has(id)){S.sel.delete(id)}else{
    const meu=partes(id),trocados=[];
    for(const x of [...S.sel]){const o=svc(x);
      if((s.grupo&&o.grupo===s.grupo)||partes(x).some(p=>meu.includes(p))){S.sel.delete(x);trocados.push(o.nome)}}

  const barbId=S.barb==="qualquer"?(livre(S.date,S.time,S.time+min,"qualquer")||barbs()[0].id):S.barb;
  const b={id:S.pid||uid(),servicos:list.map(s=>s.nome),svcIds:list.map(s=>s.id),preco,min,aPartir,data:S.date,hora:hm(S.time),barb:S.barb==="qualquer"?"qualquer":barbId,
    barbNome:S.barb==="qualquer"?"Quem estiver disponível":barbs().find(x=>x.id===S.barb).nome,pay:S.pay,cbUsado:usa,cbGanho:S.pay==="app"?Math.round((preco-usa)*LOJA.cashback*100)/100:0,
    nome:S.nome.trim(),fone:S.fone.trim(),status:"pendente",criado:new Date().toISOString()};

/* ======= remarcar ======= */
function horariosDia(data,a){
  const out=[];const d=fromIso(data);
  for(let t=LOJA.inicio;t<=LOJA.fim-Math.min(a.min,30);t+=15){
    const f=t+Math.max(a.min,10);let nota="";
    if(!lojaAberta(d))nota="fechado";
    else if(t<LOJA.almoco[1]&&f>LOJA.almoco[0])nota="almoço";
    else if(f>LOJA.fim)nota="passa das 19h";
    else{const c=S.agenda.find(x=>x.id!==a.id&&x.data===data&&!["cancelado","faltou"].includes(x.status)&&x.barb===a.barb&&t<toMin(x.hora)+x.min&&f>toMin(x.hora));if(c)nota="ocupado: "+c.nome.split(" ")[0]}
    out.push({t,nota});
  }
  return out;
}
function RemarcarSheet(a,data,hora){
  data=data||a.data;const hs=horariosDia(data,a);
  if(!hora){const livre=hs.find(h=>!h.nota&&(data!==a.data||hm(h.t)!==a.hora));hora=livre?hm(livre.t):a.hora}
  const sel=hs.find(h=>hm(h.t)===hora),aviso=sel&&sel.nota;
  const dias=[];const b0=new Date();b0.setHours(0,0,0,0);for(let k=0;k<30;k++){const x=new Date(b0);x.setDate(b0.getDate()+k);dias.push(x)}
  return `<div class="sheet" data-close><div class="panel" role="dialog" aria-modal="true" aria-label="Remarcar">
    <div class="between"><div><span class="eyebrow">Remarcar</span><h2 style="margin-top:4px">${esc(a.nome)}</h2><span class="tiny">${esc(a.servicos.join(" + "))} · ${dur(a.min)} · marcado para ${DOWS[fromIso(a.data).getDay()]} ${br(a.data)} às ${a.hora}</span></div><button class="lb-x" data-closesheet aria-label="Fechar">${ic("x")}</button></div>
    <div class="lbl">${ic("cal")} Novo dia</div>
    <div class="days">${dias.map(x=>`<button class="day ${iso(x)===data?"sel":""}" data-rmdia="${iso(x)}" data-id="${a.id}"><small>${DOWS[x.getDay()]}</small><b>${x.getDate()}</b><i>${lojaAberta(x)?MES[x.getMonth()]:"fechado"}</i></button>`).join("")}</div>
    <div class="field"><label class="lbl" for="rmhora">${ic("clock")} Novo horário</label><select id="rmhora" data-id="${a.id}" data-dia="${data}">${hs.map(h=>`<option value="${hm(h.t)}" ${hm(h.t)===hora?"selected":""}>${hm(h.t)} – ${hm(h.t+a.min)}${h.nota?" · "+h.nota:""}</option>`).join("")}</select></div>
    ${aviso?`<div class="note">Atenção: ${esc(aviso)}. Se salvar, os dois horários ficam marcados ao mesmo tempo.</div>`:""}
    <span class="err" id="rmerr"></span>
    <button class="btn btn-gold" data-rmsalvar="${a.id}" data-dia="${data}" data-forcar="${aviso?1:""}">${ic("check")} Salvar novo horário</button>
    <p class="tiny" style="margin:0">O cliente recebe aviso no celular (se ativou) e você pode mandar a mensagem no WhatsApp em seguida.</p></div></div>`;
}

async function ajustaCliente(a,delta,visita){
  const k=digits(a.fone).slice(-11);if(!k)return;
  const c=S.clientes[k]||{nome:a.nome,fone:a.fone,cashback:0,visitas:0};
  const novo={nome:a.nome||c.nome,fone:a.fone||c.fone,cashback:Math.max(0,Math.round(((c.cashback||0)+delta)*100)/100),visitas:(c.visitas||0)+visita,ultima:a.data};
  S.clientes[k]=novo;await S.db.collection(P.cl).doc(k).set(novo);
}

  if(d.lbx!==undefined){LB=null;drawOverlay();return}
  if(d.lbn){LB=(LB+ +d.lbn+PF.length)%PF.length;drawOverlay();return}
  if(d.lbgo!==undefined){LB=null;S.tab="agendar";S.done=null;render();window.scrollTo({top:0});return}
  // admin
  if(d.mode){S.mode=d.mode;render();window.scrollTo({top:0});return}
  if(d.atab){S.aTab=d.atab;render();window.scrollTo({top:0});return}
  if(d.dper){S.dPer=d.dper;render();return}
  if(d.dfiltro){S.aFiltro=d.dfiltro;S.aTab="agenda";render();window.scrollTo({top:0});return}
  if(d.limpar!==undefined){S.sheet=LimparSheet();drawOverlay();return}
  if(d.limpaop){document.querySelectorAll(".limpa-op").forEach(b=>b.classList.toggle("sel",b===t));const ids=limparIds(d.limpaop),c=document.getElementById("limpaconf");
    c.innerHTML=`<div class="stack"><div class="note">Vai apagar ${ids.length} agendamento${ids.length===1?"":"s"} (${LIMPA_TXT[d.limpaop]}).</div>${d.limpaop==="tudo"?`<div class="field"><label class="small" for="limpatxt">Para confirmar, digite LIMPAR</label><input id="limpatxt" autocomplete="off" autocapitalize="characters"></div>`:""}<button class="btn btn-danger" data-limpaok="${d.limpaop}">${ic("trash")} Apagar ${ids.length}</button></div>`;return}
  if(d.limpaok){const k=d.limpaok,err=document.getElementById("limpaerr");
    if(k==="tudo"&&(document.getElementById("limpatxt")?.value||"").trim().toUpperCase()!=="LIMPAR"){err.textContent="Digite LIMPAR para confirmar.";return}
    const ids=limparIds(k);if(!ids.length)return;t.disabled=true;err.textContent="";
    try{const r=await adm({action:"limpar",ids});const set=new Set(ids);S.agenda=S.agenda.filter(a=>!set.has(a.id));ids.forEach(id=>delete BK[id]);store.set("bkcache",BK);
      S.sheet=null;drawOverlay();toast(r.agendamentos+" agendamento"+(r.agendamentos===1?"":"s")+" apagado"+(r.agendamentos===1?"":"s"));render()}
    catch(x){t.disabled=false;err.textContent=x.message||"Não foi possível limpar."}return}
  if(d.aday){S.aDay=d.aday;render();return}
  if(d.ast){setStatus(d.id,d.ast);return}
  if(d.apago&&APP==="adminweb"){try{await adm({action:"pago",id:d.apago});const a=S.agenda.find(x=>x.id===d.apago);if(a)a.pago=true;toast("Pagamento registrado");render()}catch(err){toast("Não foi possível salvar.")}return}
  if(d.cli){S.sheet=ClienteSheet(d.cli);drawOverlay();return}
  if(d.remarcar){const a=S.agenda.find(x=>x.id===d.remarcar);if(a){S.sheet=RemarcarSheet(a);drawOverlay()}return}
  if(d.rmdia){const a=S.agenda.find(x=>x.id===d.id);if(a){S.sheet=RemarcarSheet(a,d.rmdia);drawOverlay()}return}
  if(d.rmsalvar){const a=S.agenda.find(x=>x.id===d.rmsalvar);if(!a)return;const hora=document.getElementById("rmhora").value,data=d.dia,err=document.getElementById("rmerr");
    if(data===a.data&&hora===a.hora){err.textContent="Escolha um dia ou horário diferente do atual.";return}
    t.disabled=true;try{const r=await adm({action:"remarcar",id:a.id,data,hora,forcar:!!d.forcar});
      const rm=new Date().toISOString();a.data=data;a.hora=hora;a.remarcadoEm=rm;if(a.status!=="confirmado")a.status="confirmado";if(BK[a.id]){BK[a.id].data=data;BK[a.id].hora=hora;BK[a.id].remarcadoEm=rm;store.set("bkcache",BK)}
      S.aDay=data;S.sheet=MsgSheet(a,"remarcado",r.enviados||0);render();drawOverlay();toast("Horário remarcado")}
    catch(x){t.disabled=false;err.textContent=x.message||"Não foi possível remarcar."}return}
  if(d.wamsg){const t2=document.getElementById("msgwa");openLink(waTo("55"+d.wamsg,t2?t2.value:""));S.sheet=null;drawOverlay();toast("WhatsApp aberto com a mensagem");return}
  if(d.apagar){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="Toque de novo para apagar";setTimeout(()=>{if(t.isConnected){t.dataset.armed="";t.textContent="Apagar"}},4000);return}
    try{await adm({action:"apagar",id:d.apagar});delete BK[d.apagar];store.set("bkcache",BK);S.agenda=S.agenda.filter(x=>x.id!==d.apagar);toast("Agendamento apagado");render()}catch(err){toast(err.message||"Não foi possível apagar.")}return}
  if(d.sair!==undefined){S.pin="";store.set("pin","");S.auth="nao";S.agenda=[];render();return}
  if(d.recarregar!==undefined){carregaAdmin(true).then(()=>toast("Agenda atualizada"));return}
  if(d.apago){try{await S.db.collection(P.ag).doc(d.apago).update({pago:true});toast("Pagamento registrado")}catch(err){toast("Não foi possível salvar.")}return}
  if(d.novoag!==undefined){S.sheet=NovoAg();drawOverlay();return}
  if(d.closesheet!==undefined){S.sheet=null;drawOverlay();return}
  if(d.parse!==undefined){const p=parseMsg(document.getElementById("paste").value);if(!p.nome&&!p.data){toast("Não reconheci a mensagem. Cole a mensagem completa do app.");return}S.sheet=NovoAg(p);drawOverlay();toast("Dados preenchidos. Confira e salve.");return}
  if(d.saveag!==undefined){
    const v=id=>document.getElementById(id)?.value?.trim()||"";const s=svc(v("fs"));const err=document.getElementById("ferr");
    if(!v("fn")||!v("fd")||!v("fh")){err.textContent="Preencha cliente, dia e hora.";return}
    const preco=v("fv")?Number(v("fv").replace(",",".")):s.preco;const cbu=v("fc")?Number(v("fc").replace(",",".")):0;
    const a={id:v("fid")||"",nome:v("fn"),fone:v("ff"),servicos:[s.nome],svcIds:[s.id],preco:isNaN(preco)?s.preco:preco,min:s.min,aPartir:!!s.aPartir,data:v("fd"),hora:v("fh"),
      barb:document.getElementById("fb")?.value||barbs()[0].id,pay:v("fp"),cbUsado:isNaN(cbu)?0:cbu,status:"confirmado",pago:false,criado:new Date().toISOString()};
    const fim=toMin(a.hora)+a.min,dia=fromIso(a.data);
    const avisos=[];if(!lojaAberta(dia))avisos.push("dia fechado");if(toMin(a.hora)<LOJA.almoco[1]&&fim>LOJA.almoco[0])avisos.push("cai no almoço");if(fim>LOJA.fim)avisos.push("passa das 19h");
    if(S.agenda.some(x=>x.id!==a.id&&x.data===a.data&&!["cancelado","faltou"].includes(x.status)&&(x.barb===a.barb||x.barb==="qualquer")&&toMin(a.hora)<toMin(x.hora)+x.min&&fim>toMin(x.hora)))avisos.push("conflita com outro horário");
    if(avisos.length&&t.dataset.armed!=="1"){t.dataset.armed="1";err.textContent="Atenção: "+avisos.join(", ")+". Toque em salvar de novo para manter.";return}
    if(APP!=="adminweb"&&!a.id)a.id=uid();
    try{t.disabled=true;await saveAg(a);S.sheet=null;S.aDay=a.data;toast("Agendamento salvo");render()}catch(x){t.disabled=false;err.textContent="Não foi possível salvar. Tente de novo."}
    return}
  if(d.addbarb!==undefined){const n=document.getElementById("nbarb").value.trim();if(!n)return;saveCfg({barbeiros:[...barbs(),{id:"b"+Date.now().toString(36),nome:n}]});return}
  if(d.rmbarb){saveCfg({barbeiros:barbs().filter(b=>b.id!==d.rmbarb)});return}
  if(d.renbarb!==undefined){const n=document.getElementById("ren").value.trim();if(!n)return;const l=barbs().slice();l[0]={...l[0],nome:n};saveCfg({barbeiros:l});return}
  if(d.savecfg!==undefined){saveCfg({pixChave:document.getElementById("pix").value.trim(),endereco:document.getElementById("end").value.trim()});return}
});
function maskFone(v){v=digits(v).slice(0,11);if(v.length>7)return`(${v.slice(0,2)}) ${v.slice(2,3)} ${v.slice(3,7)}-${v.slice(7)}`;if(v.length>3)return`(${v.slice(0,2)}) ${v.slice(2,3)} ${v.slice(3)}`;if(v.length>2)return`(${v.slice(0,2)}) ${v.slice(2)}`;return v}
document.addEventListener("change",e=>{if(e.target.id==="afiltro"){S.aFiltro=e.target.value;render();return}if(e.target.id==="rmhora"){const a=S.agenda.find(x=>x.id===e.target.dataset.id);if(a){S.sheet=RemarcarSheet(a,e.target.dataset.dia,e.target.value);drawOverlay()}}});
document.addEventListener("submit",e=>{if(e.target.matches("[data-login]")){e.preventDefault();const v=digits(document.getElementById("pinin").value);if(!v)return;S.pin=v;S.loginErr="";carregaAdmin()}});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="qcli"){S.qcli=e.target.value;render();return}
  if(id==="nome"||id==="cnome"){S.nome=e.target.value;store.set("nome",S.nome.trim());if(S.err.nome&&S.nome.trim()){S.err.nome=0}}
  if(id==="fone"||id==="cfone"||id==="ff"){e.target.value=maskFone(e.target.value);if(id!=="ff"){S.fone=e.target.value;store.set("fone",S.fone)}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.sheet){S.sheet=null;drawOverlay()}else if(LB!==null){LB=null;drawOverlay()}}
  if(LB!==null&&!S.sheet){if(e.key==="ArrowRight"){LB=(LB+1)%PF.length;drawOverlay()}if(e.key==="ArrowLeft"){LB=(LB-1+PF.length)%PF.length;drawOverlay()}}});
let tx=null;document.addEventListener("touchstart",e=>{if(LB!==null)tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(LB===null||tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){LB=(LB+(dx<0?1:-1)+PF.length)%PF.length;drawOverlay()}tx=null});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__bip=e;render()});
addEventListener("appinstalled",()=>{window.__bip=null;toast("App instalado na tela inicial");registraAparelho("app")});
const INSTALADO=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const h=(location.hash||"").slice(1);if(TABS_C.some(x=>x[0]===h))S.tab=h;
if(APP==="admin"){render();initCloud().finally(()=>{if(S.cloud==="off")S.cloud="pronto";render()})}
else if(APP==="adminweb"){render();carregaAdmin();registraAparelho(INSTALADO?"app":"web");
  setInterval(()=>{if(document.visibilityState==="visible"&&S.auth==="ok")carregaAdmin(true)},20000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.auth==="ok")carregaAdmin(true)});
  if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{if(e.data==="atualizar"&&S.auth==="ok")carregaAdmin(true)})}
else{render();if(API){registraAparelho(INSTALADO?"app":"web");carregaOcupados();syncMeus();
  setInterval(()=>{if(document.visibilityState==="visible"){if(S.tab==="agendar"&&S.step===3)carregaOcupados();if(S.tab==="conta")syncMeus()}},30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){syncMeus();carregaOcupados()}})}}
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script>
</body>
